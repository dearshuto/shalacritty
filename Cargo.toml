[workspace]
resolver = "2"
members = ["asura", "profiler", "profiler_core", "shalacritty", "term-gfx", "zazen"]

[workspace.dependencies]
# 2025 年 1 月 15 日のリビジョン
alacritty_terminal = { git = "https://github.com/alacritty/alacritty.git", rev = "80d87ed" }

# 2025 年 1 月 14 日のリビジョン
# 0.8.0 だと Mac でクラッシュするので、修正が入っているリポジトリーのリビジョンを直参照している
crossfont = { git = "https://github.com/alacritty/crossfont.git", rev = "dff78a0" }

tokio = { version = "1", features = ["full"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
