name: Gemini Auto Coder

on:
  issues:
    types: [labeled]

jobs:
  auto-pr:
    if: github.event.label.name == 'gemini-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Run Gemini to fix issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Issueの内容を元に修正を指示
          # --non-interactive モードで実行
          gemini --non-interactive "Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }} を解決するための修正をコードに適用して。内容: ${{ github.event.issue.body }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: automated fix by Gemini"
          title: "Gemini: Fix for Issue #${{ github.event.issue.number }}"
          body: "This PR was automatically generated by Gemini CLI in response to Issue #${{ github.event.issue.number }}."
          branch: "gemini-fix-${{ github.event.issue.number }}"
